# Publishes a GitHub release when a version tag is pushed:
#   git tag v1.3.0 && git push origin v1.3.0
# The tag must match CODEPORTAL_VERSION in src/version.hpp. The release notes are the matching
# "## [1.3.0]" section of CHANGELOG.md. `codeportal --update` installs from these releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: CodePortal/codeportal-cli
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 and NSIS
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix nsis zip

      - name: Check that the tag matches the version
        run: |
          version=$(sed -n 's/^#define CODEPORTAL_VERSION "\(.*\)"/\1/p' src/version.hpp)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CODEPORTAL_VERSION $version in src/version.hpp"
            exit 1
          fi

      - name: Build
        run: scripts/build-release.sh

      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on' ../../CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "CodePortal $GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Install:** download `CodePortal-Setup-*.exe` and run it (no administrator rights needed).
          **Update an existing install:** `codeportal --update`
          Portable: the zip contains `codeportal.exe` and the web chat page. Checksums: `SHA256SUMS.txt`.
          NOTES

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "CodePortal $GITHUB_REF_NAME" --notes-file notes.md
