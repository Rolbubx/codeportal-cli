# Publishes a GitHub release, in either of two ways:
#   - push a version tag:  git tag v1.3.0 && git push origin v1.3.0  (must match src/version.hpp)
#   - or, without git: Actions > Release > Run workflow (on main). The tag v<CODEPORTAL_VERSION> is
#     created from src/version.hpp on the chosen branch. The release notes are the matching
# "## [1.3.0]" section of CHANGELOG.md. `codeportal --update` installs from these releases.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: CodePortal/codeportal-cli
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 and NSIS
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix nsis zip

      - name: Work out the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^#define CODEPORTAL_VERSION "\(.*\)"/\1/p' src/version.hpp)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match CODEPORTAL_VERSION $version in src/version.hpp"
              exit 1
            fi
          elif gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::Release v$version already exists. Raise CODEPORTAL_VERSION in src/version.hpp first."
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Build
        run: scripts/build-release.sh

      - name: Release notes from CHANGELOG.md
        run: |
          version=${TAG#v}
          awk -v v="$version" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on' ../../CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "CodePortal $TAG" > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Install:** download `CodePortal-Setup-*.exe` and run it (no administrator rights needed).
          **Update an existing install:** `codeportal --update`
          Portable: the zip contains `codeportal.exe` and the web chat page. Checksums: `SHA256SUMS.txt`.
          NOTES

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Started by hand: gh creates the tag on the commit that was built.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "CodePortal $TAG" --notes-file notes.md
