# Builds codeportal.exe (Windows x64, fully static) and publishes it as a GitHub release
# when a version tag (v1.2.0, ...) is pushed. Can also be started by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix zip

      - name: Build codeportal.exe
        working-directory: CodePortal/codeportal-cli
        run: |
          x86_64-w64-mingw32-g++-posix -std=gnu++17 -O2 -pthread \
            src/main.cpp src/ftxui_impl.cpp -o codeportal.exe \
            -static -s -lwinhttp -lshell32
          x86_64-w64-mingw32-objdump -p codeportal.exe | grep "DLL Name"

      - name: Package
        run: |
          mkdir -p dist
          cp CodePortal/codeportal-cli/codeportal.exe dist/
          cd dist
          zip codeportal-${{ github.ref_name }}-windows-x64.zip codeportal.exe
          sha256sum codeportal.exe codeportal-*.zip > SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CodePortal ${{ github.ref_name }}
          files: |
            dist/codeportal.exe
            dist/codeportal-*.zip
            dist/SHA256SUMS.txt
          body: |
            Windows x64, single static executable: no DLL and nothing to install.

            1. Download `codeportal.exe` (or the zip).
            2. Put it in a folder on your PATH, or anywhere you like, and run it from a terminal
               (Windows Terminal recommended) in the folder of your project.
            3. On first launch, paste an API key (Poolside, Anthropic, OpenAI, Gemini...).

            Windows may show a SmartScreen warning because the file is not signed:
            "More info" → "Run anyway".

            What's new: full-screen interface (FTXUI), the agent can ask you questions while it works,
            plan progress bar, safeguards for the agent's tools (/safety), /retry resumes failed turns.
